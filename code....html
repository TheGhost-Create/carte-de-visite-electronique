<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_9');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    // Background base
    vec3 color = vec3(0.027, 0.066, 0.121); // #07111f
    
    // Subtle radial glow from bottom right
    float dist = distance(uv, vec2(1.0, 0.0));
    color += vec3(0.184, 0.502, 1.0) * (1.0 - smoothstep(0.0, 1.2, dist)) * 0.15;
    
    // Very subtle grid
    vec2 grid = fract(uv * 40.0);
    float line = step(0.98, grid.x) + step(0.98, grid.y);
    color += line * 0.02;
    
    gl_FragColor = vec4(color, 1.0);
}
`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="absolute inset-0 w-full h-full object-contain" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_8" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_8');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Geometry - Slim Premium Electronic Card
const cardGeometry = new THREE.BoxGeometry(3.37, 2.12, 0.05); // Standard card ratio
const material = new THREE.MeshPhongMaterial({ 
    color: 0x10243a, 
    shininess: 100, 
    specular: 0x2f80ff,
    transparent: true,
    opacity: 0.95
});

const card = new THREE.Mesh(cardGeometry, material);
card.rotation.y = 0.5;
card.rotation.x = 0.2;
scene.add(card);

// Adding "Circuits" via edges
const edges = new THREE.EdgesGeometry(cardGeometry);
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x2f80ff, transparent: true, opacity: 0.3 });
const wireframe = new THREE.LineSegments(edges, lineMaterial);
card.add(wireframe);

// Inner "Chip" geometry
const chipGeom = new THREE.PlaneGeometry(0.5, 0.4);
const chipMat = new THREE.MeshPhongMaterial({ color: 0x2f80ff, emissive: 0x2f80ff, emissiveIntensity: 0.5 });
const chip = new THREE.Mesh(chipGeom, chipMat);
chip.position.set(-1, 0, 0.03);
card.add(chip);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x2f80ff, 2, 10);
pointLight.position.set(2, 2, 5);
scene.add(pointLight);

camera.position.z = 6;

// Mouse Interaction
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
});

function animate() {
    requestAnimationFrame(animate);
    
    // Smooth idle rotation
    card.rotation.y += 0.002;
    
    // Mouse tracking tilt
    card.rotation.y += (mouseX * 0.5 - (card.rotation.y - 0.5)) * 0.05;
    card.rotation.x += (mouseY * 0.5 - (card.rotation.x - 0.2)) * 0.05;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
